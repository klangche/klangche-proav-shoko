name: Build

# Builds a standalone executable for Windows using PyInstaller.
#
# - Push a tag like "v1.0.1" to build and publish a GitHub Release.
# - Or run manually from the Actions tab (workflow_dispatch).
#
# macOS and Linux builds are paused (WIP).

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'run.py'
      - 'proav-shoko.json'
      - 'pyproject.toml'
      - 'proav-shoko.spec'
      - '.github/workflows/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: proav-shoko-windows
            asset: proav-shoko-windows.exe
          # macOS (Intel) - paused
          # - os: macos-13
          #   name: proav-shoko-macos-intel
          #   asset: proav-shoko-macos-intel
          # macOS (Apple Silicon) - paused
          # - os: macos-14
          #   name: proav-shoko-macos-arm64
          #   asset: proav-shoko-macos-arm64
          # Linux - paused
          # - os: ubuntu-latest
          #   name: proav-shoko-linux
          #   asset: proav-shoko-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Generate .ico from .png
        run: python scripts/generate_icon.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller proav-shoko.spec --clean

      - name: Smoke test the built executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="dist/proav-shoko.exe"
          else
            BIN="dist/${{ matrix.name }}"
            chmod +x "$BIN"
          fi
          "$BIN" --cli || echo "Smoke test exited non-zero (expected on a runner with no USB/display hardware), continuing."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/proav-shoko.exe
            dist/ProAV Shoko.exe
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts into one folder
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
