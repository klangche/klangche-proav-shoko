name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'run.py'
      - 'proav-shoko.json'
      - 'pyproject.toml'
      - 'proav-shoko.spec'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bump prerelease version
        id: bump
        shell: bash
        run: |
          python scripts/ci_bump_version.py | while IFS= read -r line; do
            if [[ "$line" =~ ^version=(.+)$ ]]; then echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"; fi
            if [[ "$line" =~ ^tag=(.+)$ ]]; then echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"; fi
            echo "$line"
          done
      - name: Commit version bump and tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/version.py proav-shoko.json pyproject.toml
          git commit -m "Bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin main --tags

  build:
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            ext: .exe
          - os: macos-13
            label: MacOS Intel
            ext: ''
            target_arch: x86_64
          - os: macos-14
            label: MacOS ARM64
            ext: ''
            target_arch: arm64
          - os: ubuntu-latest
            label: Linux
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libcairo2
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pango
      - name: Generate .ico
        run: python scripts/generate_icon.py
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller proav-shoko.spec --clean
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --onefile
          --target-arch ${{ matrix.target_arch }}
          --name "ProAV Shoko ${{ matrix.label }} ${{ needs.bump-version.outputs.version }}"
          --paths .
          --add-data "src/assets/report.css:src/assets"
          --add-data "src/assets/usb_data.csv:src/assets"
          run.py
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --onefile
          --name "ProAV Shoko Linux ${{ needs.bump-version.outputs.version }}"
          --paths .
          --add-data "src/assets/report.css:src/assets"
          --add-data "src/assets/usb_data.csv:src/assets"
          run.py
      - name: Rename Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VER="${{ needs.bump-version.outputs.version }}"
          mv dist/ProAV\ Shoko\ *.exe "dist/ProAV Shoko Windows $VER.exe"
      - name: Smoke test
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) BIN=$(ls dist/ProAV\ Shoko\ Windows* | head -1) ;;
            macOS)   BIN=$(ls dist/ProAV\ Shoko\ MacOS\ Intel* dist/ProAV\ Shoko\ MacOS\ ARM64* 2>/dev/null | head -1) ;;
            Linux)   BIN=$(ls dist/ProAV\ Shoko\ Linux* | head -1) ;;
          esac
          chmod +x "$BIN"
          "$BIN" --cli || echo "Smoke test exited non-zero (expected on a runner with no USB/display hardware), continuing."
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProAV Shoko ${{ matrix.label }} ${{ needs.bump-version.outputs.version }}${{ matrix.ext }}
          path: dist/ProAV Shoko*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts into one folder
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -la release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: ProAV Shoko ${{ needs.bump-version.outputs.version }}
          files: release/*
          generate_release_notes: true
