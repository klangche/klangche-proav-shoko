name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'run.py'
      - 'proav-shoko.json'
      - 'pyproject.toml'
      - 'proav-shoko.spec'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bump prerelease version
        id: bump
        shell: bash
        run: |
          python scripts/ci_bump_version.py | while IFS= read -r line; do
            if [[ "$line" =~ ^version=(.+)$ ]]; then echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"; fi
            if [[ "$line" =~ ^tag=(.+)$ ]]; then echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"; fi
            echo "$line"
          done
      - name: Commit version bump and tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/version.py proav-shoko.json pyproject.toml
          git commit -m "Bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin main --tags

  build-windows:
    needs: bump-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Generate .ico
        run: python scripts/generate_icon.py
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build
        run: pyinstaller proav-shoko.spec --clean
      - name: Rename exe
        shell: bash
        run: |
          VER="${{ needs.bump-version.outputs.version }}"
          mv dist/ProAV\ Shoko\ *.exe "dist/ProAV Shoko Windows $VER.exe"
      - name: Smoke test
        shell: bash
        run: |
          BIN=$(ls dist/ProAV\ Shoko\ Windows* | head -1)
          chmod +x "$BIN"
          "$BIN" --cli || echo "Smoke test exited non-zero (expected on a runner with no USB/display hardware), continuing."
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ProAV Shoko Windows ${{ needs.bump-version.outputs.version }}
          path: dist/ProAV Shoko Windows*
          if-no-files-found: error

  build-linux:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libcairo2
      - name: Generate .ico
        run: python scripts/generate_icon.py
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build
        run: >
          pyinstaller --onefile
          --name "ProAV Shoko Linux ${{ needs.bump-version.outputs.version }}"
          --paths .
          --add-data "src/assets/report.css:src/assets"
          --add-data "src/assets/usb_data.csv:src/assets"
          run.py
      - name: Smoke test
        shell: bash
        run: |
          BIN=$(ls dist/ProAV\ Shoko\ Linux* | head -1)
          chmod +x "$BIN"
          "$BIN" --cli || echo "Smoke test exited non-zero (expected on a runner with no USB/display hardware), continuing."
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ProAV Shoko Linux ${{ needs.bump-version.outputs.version }}
          path: dist/ProAV Shoko Linux*
          if-no-files-found: error

  build-macos-intel:
    needs: bump-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install x86_64 Homebrew
        run: |
          arch -x86_64 NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install system deps (x86_64)
        run: arch -x86_64 /usr/local/bin/brew install pango

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Generate .ico
        run: python scripts/generate_icon.py

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Verify architecture
        run: file $(python -c "import sys; print(sys.executable)")

      - name: Build binary
        run: >
          pyinstaller --onefile
          --target-arch x86_64
          --name "ProAV Shoko"
          --paths .
          --add-data "src/assets/report.css:src/assets"
          --add-data "src/assets/usb_data.csv:src/assets"
          run.py
      - name: Bundle as .app
        shell: bash
        run: |
          VER="${{ needs.bump-version.outputs.version }}"
          BUNDLE_NAME="ProAV Shoko MacOS Intel ${VER}.app"
          mkdir -p "dist/${BUNDLE_NAME}/Contents/MacOS"
          cp "dist/ProAV Shoko" "dist/${BUNDLE_NAME}/Contents/MacOS/ProAV Shoko"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>CFBundleExecutable</key>'
            echo '  <string>ProAV Shoko</string>'
            echo '  <key>CFBundleIdentifier</key>'
            echo '  <string>com.klangche.proav-shoko</string>'
            echo '  <key>CFBundleName</key>'
            echo '  <string>ProAV Shoko</string>'
            echo '  <key>CFBundlePackageType</key>'
            echo '  <string>APPL</string>'
            echo '  <key>CFBundleShortVersionString</key>'
            echo "  <string>${VER}</string>"
            echo '  <key>CFBundleVersion</key>'
            echo "  <string>${VER}</string>"
            echo '  <key>LSMinimumSystemVersion</key>'
            echo '  <string>10.13</string>'
            echo '</dict>'
            echo '</plist>'
          } > "dist/${BUNDLE_NAME}/Contents/Info.plist"
          rm "dist/ProAV Shoko"
          echo "Created ${BUNDLE_NAME}"
      - name: Smoke test
        shell: bash
        run: |
          APP=$(ls -d dist/ProAV\ Shoko\ MacOS\ Intel*.app | head -1)
          "$APP/Contents/MacOS/ProAV Shoko" --cli || echo "Smoke test exited non-zero (expected on a runner with no USB/display hardware), continuing."
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ProAV Shoko MacOS Intel ${{ needs.bump-version.outputs.version }}
          path: dist/ProAV Shoko MacOS Intel*.app
          if-no-files-found: error

  build-macos-arm64:
    needs: bump-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system deps
        run: brew install pango
      - name: Generate .ico
        run: python scripts/generate_icon.py
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build binary
        run: >
          pyinstaller --onefile
          --target-arch arm64
          --name "ProAV Shoko"
          --paths .
          --add-data "src/assets/report.css:src/assets"
          --add-data "src/assets/usb_data.csv:src/assets"
          run.py
      - name: Bundle as .app
        shell: bash
        run: |
          VER="${{ needs.bump-version.outputs.version }}"
          BUNDLE_NAME="ProAV Shoko MacOS ARM64 ${VER}.app"
          mkdir -p "dist/${BUNDLE_NAME}/Contents/MacOS"
          cp "dist/ProAV Shoko" "dist/${BUNDLE_NAME}/Contents/MacOS/ProAV Shoko"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>CFBundleExecutable</key>'
            echo '  <string>ProAV Shoko</string>'
            echo '  <key>CFBundleIdentifier</key>'
            echo '  <string>com.klangche.proav-shoko</string>'
            echo '  <key>CFBundleName</key>'
            echo '  <string>ProAV Shoko</string>'
            echo '  <key>CFBundlePackageType</key>'
            echo '  <string>APPL</string>'
            echo '  <key>CFBundleShortVersionString</key>'
            echo "  <string>${VER}</string>"
            echo '  <key>CFBundleVersion</key>'
            echo "  <string>${VER}</string>"
            echo '  <key>LSMinimumSystemVersion</key>'
            echo '  <string>10.13</string>'
            echo '</dict>'
            echo '</plist>'
          } > "dist/${BUNDLE_NAME}/Contents/Info.plist"
          rm "dist/ProAV Shoko"
          echo "Created ${BUNDLE_NAME}"
      - name: Smoke test
        shell: bash
        run: |
          APP=$(ls -d dist/ProAV\ Shoko\ MacOS\ ARM64*.app | head -1)
          "$APP/Contents/MacOS/ProAV Shoko" --cli || echo "Smoke test exited non-zero (expected on a runner with no USB/display hardware), continuing."
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ProAV Shoko MacOS ARM64 ${{ needs.bump-version.outputs.version }}
          path: dist/ProAV Shoko MacOS ARM64*.app
          if-no-files-found: error

  release:
    name: Publish release
    needs: [bump-version, build-windows, build-linux, build-macos-intel, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
      - name: Flatten artifacts into one folder
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -la release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: ProAV Shoko ${{ needs.bump-version.outputs.version }}
          files: release/*
          generate_release_notes: true
