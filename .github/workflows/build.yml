name: Build & Release

# Every push to `main` that touches source files auto-increments the
# prerelease number (e.g. 0.4.0-beta.5 → 0.4.0-beta.6), builds a
# Windows executable, and publishes a GitHub Release.
#
# Use `workflow_dispatch` in the Actions tab to trigger manually.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'run.py'
      - 'proav-shoko.json'
      - 'pyproject.toml'
      - 'proav-shoko.spec'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bump prerelease version
        id: bump
        run: |
          python scripts/ci_bump_version.py | ForEach-Object {
            if ($_ -match '^version=(.+)$') { "version=$($matches[1])" >> $env:GITHUB_OUTPUT }
            if ($_ -match '^tag=(.+)$')     { "tag=$($matches[1])" >> $env:GITHUB_OUTPUT }
            Write-Host $_
          }

      - name: Commit version bump and tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/version.py proav-shoko.json pyproject.toml
          git commit -m "Bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin main --tags

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Generate .ico from .png
        run: python scripts/generate_icon.py

      - name: Build executable (Windows)
        run: pyinstaller proav-shoko.spec --clean

      - name: Smoke test
        shell: bash
        run: |
          BIN="dist/proav-shoko.exe"
          "$BIN" --cli || echo "Smoke test exited non-zero (expected on a runner with no USB/display hardware), continuing."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ProAV Shoko ${{ steps.bump.outputs.version }}
          files: |
            dist/proav-shoko.exe
            dist/ProAV Shoko.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
