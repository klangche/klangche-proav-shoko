name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'run.py'
      - 'proav-shoko.json'
      - 'pyproject.toml'
      - 'proav-shoko.spec'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bump prerelease version
        id: bump
        shell: bash
        run: |
          python scripts/ci_bump_version.py | while IFS= read -r line; do
            if [[ "$line" =~ ^version=(.+)$ ]]; then echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"; fi
            if [[ "$line" =~ ^tag=(.+)$ ]]; then echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"; fi
            echo "$line"
          done
      - name: Commit version bump and tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/version.py proav-shoko.json pyproject.toml
          git commit -m "Bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin main --tags

  build-windows:
    needs: bump-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Generate .ico
        run: python scripts/generate_icon.py
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build
        run: pyinstaller proav-shoko.spec --clean
      - name: Rename exe
        shell: bash
        run: |
          VER="${{ needs.bump-version.outputs.version }}"
          mv dist/ProAV\ Shoko\ *.exe "dist/ProAV Shoko Windows $VER.exe"
      - name: Smoke test
        shell: bash
        run: |
          BIN=$(ls dist/ProAV\ Shoko\ Windows* | head -1)
          chmod +x "$BIN"
          "$BIN" --cli || echo "Smoke test exited non-zero (expected on a runner with no USB/display hardware), continuing."
      - name: Upload exe
        uses: actions/upload-artifact@v6
        with:
          name: ProAV Shoko Windows ${{ needs.bump-version.outputs.version }}
          path: dist/ProAV Shoko Windows*.exe
          if-no-files-found: error

  build-linux:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libcairo2
      - name: Generate .ico
        run: python scripts/generate_icon.py
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build
        run: >
          pyinstaller --onefile
          --name "ProAV Shoko Linux ${{ needs.bump-version.outputs.version }}"
          --paths .
          --add-data "src/assets/report.css:src/assets"
          --add-data "src/assets/usb_data.csv:src/assets"
          run.py
      - name: Smoke test
        shell: bash
        run: |
          BIN=$(ls dist/ProAV\ Shoko\ Linux* | head -1)
          chmod +x "$BIN"
          "$BIN" --cli || echo "Smoke test exited non-zero (expected on a runner with no USB/display hardware), continuing."
      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: ProAV Shoko Linux ${{ needs.bump-version.outputs.version }}
          path: dist/ProAV Shoko Linux*
          if-no-files-found: error

  build-macos:
    needs: bump-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system deps
        run: brew install pango
      - name: Generate .ico
        run: python scripts/generate_icon.py
      - name: Generate .icns
        run: python scripts/generate_icns.py
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build universal2 binary
        run: >
          pyinstaller --onefile
          --target-arch universal2
          --name "ProAV Shoko"
          --paths .
          --add-data "src/assets/report.css:src/assets"
          --add-data "src/assets/usb_data.csv:src/assets"
          run.py
      - name: Bundle as .app
        shell: bash
        run: |
          VER="${{ needs.bump-version.outputs.version }}"
          BUNDLE_NAME="ProAV Shoko MacOS ${VER}.app"
          mkdir -p "dist/${BUNDLE_NAME}/Contents/MacOS"
          cp "dist/ProAV Shoko" "dist/${BUNDLE_NAME}/Contents/MacOS/ProAV Shoko"
          mkdir -p "dist/${BUNDLE_NAME}/Contents/Resources"
          cp "src/resources/shoko-icon.icns" "dist/${BUNDLE_NAME}/Contents/Resources/shoko-icon.icns"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>CFBundleExecutable</key>'
            echo '  <string>ProAV Shoko</string>'
            echo '  <key>CFBundleIconFile</key>'
            echo '  <string>shoko-icon</string>'
            echo '  <key>CFBundleIdentifier</key>'
            echo '  <string>com.klangche.proav-shoko</string>'
            echo '  <key>CFBundleName</key>'
            echo '  <string>ProAV Shoko</string>'
            echo '  <key>CFBundlePackageType</key>'
            echo '  <string>APPL</string>'
            echo '  <key>CFBundleShortVersionString</key>'
            echo "  <string>${VER}</string>"
            echo '  <key>CFBundleVersion</key>'
            echo "  <string>${VER}</string>"
            echo '  <key>LSMinimumSystemVersion</key>'
            echo '  <string>10.15</string>'
            echo '</dict>'
            echo '</plist>'
          } > "dist/${BUNDLE_NAME}/Contents/Info.plist"
          codesign --force --deep --sign - "dist/${BUNDLE_NAME}"
          rm "dist/ProAV Shoko"
          echo "Created ${BUNDLE_NAME}"
      - name: Smoke test
        shell: bash
        run: |
          APP=$(ls -d dist/ProAV\ Shoko\ MacOS*.app | head -1)
          "$APP/Contents/MacOS/ProAV Shoko" --cli || echo "Smoke test exited non-zero (expected on a runner with no USB/display hardware), continuing."
      - name: Create .dmg
        shell: bash
        run: |
          VER="${{ needs.bump-version.outputs.version }}"
          APP_NAME="ProAV Shoko MacOS ${VER}.app"
          DMG_NAME="ProAV Shoko MacOS ${VER}.dmg"
          STAGE="dmg-staging"
          cd dist
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP_NAME" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          sed -e "s#__APP_NAME__#${APP_NAME}#g" ../scripts/dmg/README-macOS.txt > "$STAGE/How to run ProAV Shoko.txt"
          hdiutil create -volname "ProAV Shoko" -srcfolder "$STAGE" -ov -format UDZO "$DMG_NAME"
          rm -rf "$APP_NAME" "$STAGE"
      - name: Upload .dmg
        uses: actions/upload-artifact@v6
        with:
          name: ProAV Shoko MacOS ${{ needs.bump-version.outputs.version }}
          path: dist/ProAV Shoko MacOS*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: [bump-version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Package release zips
        run: |
          mkdir -p release
          for f in dist/*.exe dist/*.dmg dist/ProAV\ Shoko\ Linux*; do
            [ -f "$f" ] || continue
            base=$(basename "$f" | sed 's/\.exe$//; s/\.dmg$//')
            zip -j "release/${base}.zip" "$f"
          done
          ls -la release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: ProAV Shoko ${{ needs.bump-version.outputs.version }}
          files: release/*
          generate_release_notes: true
